#
# The page's two questions. errors:no on each: both print a JSON answer and exit 0, and this keeps
# the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/portguard/status.py
parameters:
errors:no
type:script_output
message:reading the port guard

# The alias made to say what the device list says, then the filter reloaded, which registers the
# rules (plugins.inc.d/portguard.inc), and the aliases, which resolves the addresses - the whole of the
# page's Apply, so this alone puts the list into the firewall (2026-10-29).
[apply]
command:/usr/local/opnsense/scripts/portguard/apply.php
parameters:
errors:no
type:script_output
message:putting the port guard's device list into the firewall

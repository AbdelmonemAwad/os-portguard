#
# The page's two questions. errors:no on each: both print a JSON answer and exit 0, and this keeps
# the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/portguard/status.py
parameters:
errors:no
type:script_output
message:reading the port guard

# The alias made to say what the device list says. The page's Apply then reloads the filter, which
# registers the rules (plugins.inc.d/portguard.inc), and the aliases, which resolves the addresses.
[apply]
command:/usr/local/opnsense/scripts/portguard/apply.php
parameters:
errors:no
type:script_output
message:writing the port guard's alias

#
# The page's questions, and the cut. errors:no on each: every script here prints a JSON answer and
# exits 0, and this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/portguard/status.py
parameters:
errors:no
type:script_output
message:reading the port guard

# The alias made to say what the device list says, then the filter reloaded, which registers the
# rules (plugins.inc.d/portguard.inc), the aliases, which resolves the addresses, and the cut below -
# the whole of the page's Apply, so this alone puts the list into the firewall (2026-10-29).
[apply]
command:/usr/local/opnsense/scripts/portguard/apply.php
parameters:
errors:no
type:script_output
message:putting the port guard's device list into the firewall

# The connections a listed device already has open, cut: by apply.php after the aliases are
# refreshed, and every minute from cron.d/portguard for an address the alias has just gained.
[cut]
command:/usr/local/opnsense/scripts/portguard/cut.py
parameters:
errors:no
type:script_output
message:cutting the open connections of the blocked devices

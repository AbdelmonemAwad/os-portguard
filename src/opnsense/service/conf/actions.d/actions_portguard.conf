#
# The page's questions, and the cut. errors:no on each: every script here prints a JSON answer and
# exits 0, and this keeps the answer if one ever does not.

[status]
command:/usr/local/opnsense/scripts/portguard/status.py
parameters:
errors:no
type:script_output
message:reading the port guard

# The alias made to say what the device list says, then the filter reloaded, which registers the
# rules (plugins.inc.d/portguard.inc), the aliases, which resolves the addresses, and the cut below -
# the whole of the page's Apply, so this alone puts the list into the firewall (2026-10-29).
[apply]
command:/usr/local/opnsense/scripts/portguard/apply.php
parameters:
errors:no
type:script_output
message:putting the port guard's device list into the firewall

# The connections a listed device already has open, cut: by apply.php after the aliases are
# refreshed, and every minute from cron.d/portguard for an address the alias has just gained.
[cut]
command:/usr/local/opnsense/scripts/portguard/cut.py
parameters:
errors:no
type:script_output
message:cutting the open connections of the blocked devices

# Automatic isolation: one run, as cron.d/portguard runs it every minute; apply.php runs it too, so
# turning the option on or off takes effect at Apply.
[isolate]
command:/usr/local/opnsense/scripts/portguard/isolate.py run
parameters:
errors:no
type:script_output
message:isolating the devices that reached a command-and-control list

# The Isolated devices tab: the list, with the client address the page is opened from, kept as an
# exception that is never isolated.
[isolated]
command:/usr/local/opnsense/scripts/portguard/isolate.py list
parameters:%s
errors:no
type:script_output
message:reading the isolated devices

# Undo: a device let go at once (its MAC address, and the page's client address).
[release]
command:/usr/local/opnsense/scripts/portguard/isolate.py undo
parameters:%s %s
errors:no
type:script_output
message:letting an isolated device go
